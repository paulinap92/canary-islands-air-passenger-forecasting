name: Update data and forecasts

on:
  workflow_dispatch:
  schedule:
    # Weekly check. GitHub Actions cron uses UTC.
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: monthly-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Update data, forecasts, and forecast history
        env:
          FORECAST_HORIZON_MONTHS: "12"
        run: python monthly_update.py

      - name: Commit updated production outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find data -maxdepth 1 -type f -name '*.xlsx' -print0 | xargs -0 -r git add

          for path in \
            result.csv \
            result_total.csv \
            result_total_with_lags.csv \
            result_total_with_lags_coded.csv \
            forecast_total_canarias_xgb.csv \
            forecast_total_canarias_lstm.csv \
            forecast_history.csv
          do
            if [ -e "$path" ]; then
              git add "$path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new monthly data or forecast output to commit."
            exit 0
          fi

          git commit -m "Update monthly passenger forecasts"
          git push

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Check for critical Python errors
        run: ruff check . --select E9,F63,F7,F82 --output-format=github

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Validate dashboard datasets
        run: |
          python - <<'PY'
          import pandas as pd

          files = {
              "result.csv": ["Fecha", "Isla"],
              "forecast_total_canarias_xgb.csv": ["Fecha"],
              "forecast_total_canarias_lstm.csv": ["Fecha"],
          }

          for path, required_columns in files.items():
              frame = pd.read_csv(path, encoding="utf-8-sig")
              missing = [column for column in required_columns if column not in frame.columns]
              if missing:
                  raise SystemExit(f"{path}: missing required columns {missing}")
              if frame.empty:
                  raise SystemExit(f"{path}: dataset is empty")
              print(f"{path}: {len(frame)} rows")
          PY

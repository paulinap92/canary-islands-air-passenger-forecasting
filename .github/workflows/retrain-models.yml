name: Train model candidates

on:
  workflow_dispatch:
  schedule:
    # Quarterly candidate training: 5 Jan/Apr/Jul/Oct at 03:00 UTC.
    - cron: "0 3 5 1,4,7,10 *"

permissions:
  contents: read

concurrency:
  group: quarterly-model-retraining
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install training dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Synchronize lag and rolling features
        run: python -c "from download_agent import build_features; build_features()"

      - name: Train and compare XGBoost candidates
        run: python training/retrain_models.py

      - name: Train and compare LSTM candidates
        run: python training/train_lstm.py

      - name: Validate candidate reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in (
              Path("models/xgb_candidate_metrics.json"),
              Path("models/lstm_candidate_metrics.json"),
          ):
              report = json.loads(path.read_text(encoding="utf-8"))
              assert report["selected_scope"] in {"all_history", "post_covid"}
              assert report["automatic_production_replacement"] is False
              assert len(report["candidates"]) == 2
              print(path, report["selected_scope"])
          PY

      - name: Upload candidate models and metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-candidates-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            models/xgb_candidate.pkl
            models/xgb_candidate_metrics.json
            models/lstm_candidate.keras
            models/scaler_y_candidate.pkl
            models/lstm_candidate_metrics.json

      - name: Write review reminder
        run: |
          echo "Candidate artifacts were created only."
          echo "Full-history and post-COVID variants were compared."
          echo "No production model was replaced."
          echo "Review validation metrics before promoting any candidate."

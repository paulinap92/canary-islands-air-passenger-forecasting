name: Forecast CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  forecast-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install --quiet -r requirements-pipeline.txt

      - name: Synchronize lag and rolling features
        run: python -c "from download_agent import build_features; build_features()"

      - name: Test forecast horizon
        run: |
          python - <<'PY'
          import pandas as pd
          from forecast_horizon import build_future_dates

          dates = build_future_dates(pd.Timestamp("2026-06-01"), 12, "2027-12-01")
          assert len(dates) == 18
          assert dates[0] == pd.Timestamp("2026-07-01")
          assert dates[-1] == pd.Timestamp("2027-12-01")
          rolling = build_future_dates(pd.Timestamp("2027-06-01"), 12, "2027-12-01")
          assert rolling[-1] == pd.Timestamp("2028-06-01")
          print("Forecast horizon tests passed.")
          PY

      - name: Run XGBoost production-model inference
        env:
          FORECAST_HORIZON_MONTHS: "12"
          FORECAST_END_DATE: "2027-12-01"
        run: python model_final_xgb.py

      - name: Run LSTM production-model inference
        env:
          FORECAST_HORIZON_MONTHS: "12"
          FORECAST_END_DATE: "2027-12-01"
          TF_CPP_MIN_LOG_LEVEL: "2"
        run: python model_final_lstm.py

      - name: Build forecast history
        run: python forecast_history.py

      - name: Validate forecast outputs
        run: |
          python - <<'PY'
          import pandas as pd

          expected_history_end = pd.Timestamp("2026-06-01")
          expected_start = pd.Timestamp("2026-07-01")
          expected_end = pd.Timestamp("2027-12-01")

          for path in (
              "forecast_total_canarias_xgb.csv",
              "forecast_total_canarias_lstm.csv",
          ):
              frame = pd.read_csv(path, encoding="utf-8-sig")
              frame["Fecha"] = pd.to_datetime(frame["Fecha"])
              history = frame[frame["Phase"] == "History"]
              future = frame[frame["Phase"] == "Forecast"]
              assert history["Fecha"].max() == expected_history_end, (
                  path,
                  history["Fecha"].max(),
              )
              assert len(future) == 18, (path, len(future))
              assert future["Fecha"].min() == expected_start
              assert future["Fecha"].max() == expected_end
              assert future["Pasajeros"].notna().all(), f"{path}: NaN predictions"
              assert (future["Pasajeros"] >= 0).all(), f"{path}: negative predictions"
              print(path, len(future), future["Fecha"].min(), future["Fecha"].max())

          forecast_history = pd.read_csv("forecast_history.csv", encoding="utf-8-sig")
          assert set(forecast_history["model"]) == {"XGB", "LSTM"}
          assert len(forecast_history) == 36
          assert set(pd.to_datetime(forecast_history["forecast_origin"])) == {
              expected_history_end
          }
          assert pd.to_datetime(forecast_history["target_date"]).max() == expected_end
          assert forecast_history["prediction"].notna().all()
          print("forecast_history.csv", len(forecast_history))
          PY

      - name: Upload validated forecast outputs
        uses: actions/upload-artifact@v4
        with:
          name: validated-forecast-outputs
          if-no-files-found: error
          retention-days: 7
          path: |
            result_total_with_lags.csv
            result_total_with_lags_coded.csv
            forecast_total_canarias_xgb.csv
            forecast_total_canarias_lstm.csv
            forecast_history.csv

      - name: Commit validated outputs to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            result_total_with_lags.csv \
            result_total_with_lags_coded.csv \
            forecast_total_canarias_xgb.csv \
            forecast_total_canarias_lstm.csv \
            forecast_history.csv

          if git diff --cached --quiet; then
            echo "Validated outputs are already current."
            exit 0
          fi

          git commit -m "Update validated forecast outputs [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

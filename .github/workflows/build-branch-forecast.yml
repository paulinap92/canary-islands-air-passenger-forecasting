name: Build branch forecast preview

on:
  push:
    branches:
      - agent/separate-training-and-forecasting
    paths:
      - forecast_horizon.py
      - model_final_xgb.py
      - model_final_lstm.py
      - forecast_history.py
      - result_total.csv
      - result_total_with_lags_coded.csv
      - models/xgb_best.pkl
      - models/lstm_best.h5
      - models/scaler_y.pkl
      - .github/workflows/build-branch-forecast.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-forecast-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install pipeline dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Generate production-model forecasts
        env:
          FORECAST_HORIZON_MONTHS: "12"
          FORECAST_END_DATE: "2027-12-01"
        run: |
          python model_final_xgb.py
          python model_final_lstm.py
          python forecast_history.py

      - name: Validate generated forecast range
        run: |
          python - <<'PY'
          import pandas as pd

          expected_end = pd.Timestamp("2027-12-01")
          for path in (
              "forecast_total_canarias_xgb.csv",
              "forecast_total_canarias_lstm.csv",
          ):
              frame = pd.read_csv(path, encoding="utf-8-sig")
              frame["Fecha"] = pd.to_datetime(frame["Fecha"])
              future = frame[frame["Phase"] == "Forecast"]
              assert not future.empty, f"{path}: no future rows"
              assert future["Fecha"].max() >= expected_end, (
                  f"{path}: ends at {future['Fecha'].max()}, expected at least {expected_end}"
              )
              assert future["Pasajeros"].notna().all(), f"{path}: null predictions"
              assert (future["Pasajeros"] >= 0).all(), f"{path}: negative predictions"
              print(path, len(future), future["Fecha"].min(), future["Fecha"].max())

          history = pd.read_csv("forecast_history.csv", encoding="utf-8-sig")
          assert {"XGB", "LSTM"}.issubset(set(history["model"]))
          assert pd.to_datetime(history["target_date"]).max() >= expected_end
          print("forecast_history.csv", len(history))
          PY

      - name: Commit preview outputs to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            forecast_total_canarias_xgb.csv \
            forecast_total_canarias_lstm.csv \
            forecast_history.csv
          if git diff --cached --quiet; then
            echo "Forecast outputs already current."
            exit 0
          fi
          git commit -m "Generate forecast preview through 2027"
          git push
